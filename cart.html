<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart — Shoe Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Member_1_Core_Layout/assets/css/core.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sh-navbar">
        <div class="container">
            <a class="navbar-brand" href="../Member_2_Home_Info/index.html">👟 Shoe<span>Haven</span></a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="shop.html">← Continue Shopping</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h3 class="fw-bold mb-4">Your Shopping Bag</h3>

        <div class="row g-4">
            <div class="col-lg-8">
                <!-- Free Shipping Progress Tracker -->
                <div class="sh-free-delivery-tracker mb-4">
                    <div id="deliveryProgressText" class="mb-2">Calculating shipping eligibility...</div>
                    <div class="progress" style="height: 8px;">
                        <div id="deliveryProgress" class="progress-bar bg-warning" role="progressbar" style="width: 50%;"></div>
                    </div>
                </div>

                <!-- Cart Items Container -->
                <div id="cartItemsContainer"></div>
            </div>

            <div class="col-lg-4">
                <div class="sh-summary-card shadow-sm">
                    <h5 class="fw-bold mb-3">Order Summary</h5>

                    <!-- Voucher code input -->
                    <div class="input-group mb-3">
                        <input type="text" id="voucherInput" class="form-control" placeholder="Promo code (MUSTSTUDENT)">
                        <button class="btn btn-dark" onclick="applyVoucher()">Apply</button>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Subtotal</span>
                        <span id="summarySubtotal" class="fw-bold">UGX 0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-secondary">Campus Discount</span>
                        <span id="summaryDiscount" class="fw-bold text-success">- UGX 0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-secondary">Estimated Delivery</span>
                        <span class="fw-bold text-success">FREE (Mbarara)</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                        <span>Total</span>
                        <span id="summaryTotal" class="text-danger">UGX 0</span>
                    </div>
                    <a href="checkout.html" class="btn btn-sh-orange w-100 py-3 fs-6">
                        Proceed to Checkout <i class="bi bi-arrow-right ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="sh-global-toast" class="sh-toast"><i class="bi bi-check-circle-fill text-success fs-4"></i><div id="sh-toast-text"></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Member_1_Core_Layout/assets/js/core.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
