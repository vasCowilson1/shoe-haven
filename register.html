<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Shoe Haven</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Member_1_Core_Layout/assets/css/core.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="card p-4 rounded-4 border shadow-sm" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <a href="../Member_2_Home_Info/index.html" class="text-decoration-none fs-3 fw-bold text-dark">👟 Shoe<span style="color:var(--sh-orange);">Haven</span></a>
            <p class="text-secondary small mt-1">Join Shoe Haven Mbarara Community</p>
        </div>
        <form onsubmit="event.preventDefault(); window.location.href='profile.html';">
            <div class="mb-3">
                <label class="form-label small fw-bold">Full Name</label>
                <input type="text" class="form-control" required placeholder="Joshua Tumusiime">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" required placeholder="name@must.ac.ug">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Telephone (MTN / Airtel)</label>
                <input type="tel" class="form-control" required placeholder="+256 7...">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" class="form-control" required minlength="8">
            </div>
            <button type="submit" class="btn btn-sh-orange w-100 py-2 fw-bold mb-3">Create My Account</button>
            <div class="text-center small">
                Already registered? <a href="login.html" class="fw-bold text-danger text-decoration-none">Sign In</a>
            </div>
        </form>
    </div>
    <script src="../Member_1_Core_Layout/assets/js/core.js"></script>
</body>
</html>
